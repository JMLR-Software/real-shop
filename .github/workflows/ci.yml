# Tests gate the deploy, and the branch picks the environment:
#   main    -> production (phase 1 with every planted bug; readers fork it)
#   phase-1 -> staging    (the fixed shop)
name: ci
on:
  push:
    branches: [main, phase-1]
  pull_request:
# An expression inside a flow mapping ({ ... }) is not valid YAML, so these stay in block style.
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: false
permissions: { contents: read }

jobs:
  test:
    # main is red on purpose (the planted bugs); only phase-1 and PRs must be green.
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # The version comes from packageManager in package.json.
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  deploy:
    needs: [test]
    # A push deploys. On main the test job is skipped, so "skipped" counts as a pass there;
    # a red phase-1 never reaches staging.
    if: ${{ !cancelled() && github.event_name == 'push' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_PUBLIC_CF_BEACON_TOKEN: ${{ secrets.CF_BEACON_TOKEN }}
      - name: Pick the environment
        run: echo "WRANGLER_ENV=${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}" >> "$GITHUB_ENV"
      - name: Migrate, then deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler d1 migrations apply "hard-three-shop-$WRANGLER_ENV" --remote --env "$WRANGLER_ENV"
          pnpm exec wrangler deploy --env "$WRANGLER_ENV"
