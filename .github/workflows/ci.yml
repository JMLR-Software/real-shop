# Tests gate the deploy, and the branch picks the environment:
#   main    -> production
#   staging -> staging
name: ci
on:
  push:
    branches: [main, staging]
  pull_request:
# An expression inside a flow mapping ({ ... }) is not valid YAML, so these stay in block style.
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: false
permissions: { contents: read }

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # The version comes from packageManager in package.json.
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  deploy:
    needs: [test]
    # A push deploys, only after the tests pass.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_PUBLIC_CF_BEACON_TOKEN: ${{ secrets.CF_BEACON_TOKEN }}
      - name: Pick the environment
        run: echo "WRANGLER_ENV=${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}" >> "$GITHUB_ENV"
      - name: Migrate, then deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler d1 migrations apply DB --remote --env "$WRANGLER_ENV"
          pnpm exec wrangler deploy --env "$WRANGLER_ENV"
