# This repo is a practice app for a course and takes no pull requests: readers keep
# their fixes on their own forks. Every PR gets a note and is closed.
name: close-prs
on:
  pull_request_target:
    types: [opened, reopened]
permissions: { pull-requests: write }
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            await github.rest.issues.createComment({ owner, repo, issue_number, body: "Thanks! This repo is a practice app for a course and takes no pull requests. Keep your fix on your own fork; that is the point of the exercise." });
            await github.rest.pulls.update({ owner, repo, pull_number: issue_number, state: "closed" });
